name: Public companion CI

on:
  push:
    branches:
      - main
      - sync/private-main
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: public-companion-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public export boundary and data
        run: python tests/validate_public_export.py
      - name: Check reader-facing JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src/wordpress/javascript -type f -name '*.js' -print0)
      - name: Lint exported WordPress PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            php -l "$file"
          done < <(find src/wordpress/plugins -type f -name '*.php' -print0)
      - name: Write public CI summary
        if: always()
        run: |
          {
            echo "## Workforce Wonkery public companion CI"
            echo
            echo "- Repository boundary and provenance checked"
            echo "- Public JSON parsed and runtime hashes checked"
            echo "- Exported JavaScript syntax checked"
            echo "- Exported WordPress PHP linted"
          } >> "$GITHUB_STEP_SUMMARY"

  live-structure:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check governed public surfaces
        run: |
          set -o pipefail
          python tests/site_structure_check.py | tee /tmp/site-structure.log
      - name: Write structural summary
        if: always()
        run: |
          {
            echo "## Live structural smoke"
            echo
            echo '~~~text'
            test -f /tmp/site-structure.log && cat /tmp/site-structure.log || echo "Structural check did not run."
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  discovery:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Run Discovery desktop and mobile canary
        env:
          DISCOVERY_ONLY: "1"
        run: python tests/browser_acceptance.py
      - name: Upload Discovery evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: public-discovery-acceptance
          path: qa/artifacts/browser-acceptance
          if-no-files-found: warn
          retention-days: 7

  browser-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Run full public-site browser acceptance
        run: python tests/browser_acceptance.py
      - name: Upload browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-acceptance
          path: qa/artifacts/browser-acceptance
          if-no-files-found: warn
          retention-days: 7
