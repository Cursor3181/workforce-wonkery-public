<script id="ww-mobile-ux-system-script-v1">
(function(){
  function mainRoot(){
    return document.querySelector('.wp-block-post-content,#ww-pilot-v6,.wd-ui,.waeh,.ww-intel,main');
  }
  function addTocAndActions(){
    const root=mainRoot(); if(!root)return;
    const h1=root.querySelector('h1'); const hs=[...root.querySelectorAll('h2,h3')].filter(h=>h.offsetParent!==null);
    if(!h1||hs.length<4||root.scrollHeight<1700)return;
    hs.forEach((h,i)=>{if(!h.id)h.id='section-'+(i+1)+'-'+h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,42)});
    const toc=document.createElement('details');toc.className='ww-mobile-toc';
    toc.innerHTML='<summary>On this page</summary><nav>'+hs.slice(0,8).map(h=>'<a href="#'+h.id+'">'+h.textContent.trim()+'</a>').join('')+'</nav>';
    const actions=document.createElement('div');actions.className='ww-mobile-actions';
    actions.innerHTML='<button type="button" data-act="share">Share</button><button type="button" data-act="copy">Copy link</button><button type="button" data-act="save">Save for later</button>';
    const anchor=h1.parentElement||h1; anchor.insertAdjacentElement('afterend',actions);actions.insertAdjacentElement('afterend',toc);
    const save=actions.querySelector('[data-act="save"]'); const key='ww-save:'+location.href.split('#')[0];
    if(localStorage.getItem(key)){save.dataset.saved='true';save.textContent='Saved'}
    actions.addEventListener('click',async e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.act==='share'){
        if(navigator.share){try{await navigator.share({title:document.title,url:location.href});}catch(_){}}else{navigator.clipboard&&navigator.clipboard.writeText(location.href);b.textContent='Link copied'}
      }
      if(b.dataset.act==='copy'){navigator.clipboard&&navigator.clipboard.writeText(location.href);b.textContent='Copied'}
      if(b.dataset.act==='save'){
        if(localStorage.getItem(key)){localStorage.removeItem(key);b.dataset.saved='false';b.textContent='Save for later'}else{localStorage.setItem(key,document.title);b.dataset.saved='true';b.textContent='Saved'}
      }
    });
  }
  function addNext(){
    const root=mainRoot(); if(!root||document.querySelector('.ww-mobile-next'))return;
    const p=location.pathname; let links;
    if(p.indexOf('/data')===0)links=[['See related policy','https://workforcewonkery.com/policy-briefs/'],['See how others are doing it','https://workforcewonkery.com/practice/']];
    else if(p.indexOf('/practice')===0||p.indexOf('/national-practice')===0)links=[['Check the policy landscape','https://workforcewonkery.com/policy-briefs/'],['Check the data','https://workforcewonkery.com/data/']];
    else links=[['Check the data','https://workforcewonkery.com/data/'],['See practical examples','https://workforcewonkery.com/practice/']];
    const box=document.createElement('aside');box.className='ww-mobile-next';box.innerHTML='<strong>Keep going</strong>'+links.map(x=>'<a href="'+x[1]+'">'+x[0]+'</a>').join('');
    const foot=root.querySelector('.ep-footer')||document.querySelector('footer');
    if(foot&&foot.parentNode===root)root.insertBefore(box,foot);else root.appendChild(box);
  }
  function addDataJump(){
    if(location.pathname.indexOf('/data')!==0)return;
    const root=mainRoot();if(!root||document.querySelector('.ww-mobile-data-jump'))return;
    const controls=root.querySelector('.wd-controls,.wd-filterbar,.wd-filters,.waeh-controls,.waeh-filterbar,.ww-explorer-tools,.ww-geo-selector,select');
    const h1=root.querySelector('h1');if(!controls||!h1)return;
    if(!controls.id)controls.id='ww-mobile-data-controls';
    const a=document.createElement('a');a.className='ww-mobile-data-jump';a.href='#'+controls.id;a.textContent='Adjust data controls ↓';
    (h1.parentElement||h1).insertAdjacentElement('afterend',a);
  }
  function optimizeGuidanceGrids(){
    if(location.pathname.indexOf('/practice/quickstarts/')!==0)return;
    const grids=[...document.querySelectorAll('.wp-block-post-content div[style*="grid-template-columns:repeat(3"],.wp-block-post-content div[style*="grid-template-columns: repeat(3"]')];
    grids.forEach(grid=>{
      const kids=[...grid.children].filter(el=>el.tagName==='DIV');
      if(kids.length!==3)return;
      const labels=kids.map(k=>(k.querySelector('small')?.textContent||'').trim().toLowerCase());
      const looksLikeGuide=labels.some(x=>x.includes('use this when'))&&labels.some(x=>x.includes('need to decide'))&&labels.some(x=>x.includes('verify against'));
      if(looksLikeGuide)grid.classList.add('ww-mobile-guidance-grid');
    });
  }
  function optimizePolicyTables(){
    if(!document.body.classList.contains('single-post'))return;
    const figures=[...document.querySelectorAll('.wp-block-post-content figure.wp-block-table')];
    figures.forEach(fig=>{
      const table=fig.querySelector('table'); if(!table)return;
      const head=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
      if(head.length>=3){
        fig.classList.add('ww-mobile-table-cards');
        const prev=fig.previousElementSibling;
        if(prev&&/^h[1-6]$/i.test(prev.tagName)&&/decision strip/i.test(prev.textContent||'')) fig.classList.add('ww-mobile-decision-strip');
        table.querySelectorAll('tbody tr').forEach(tr=>{
          [...tr.children].forEach((cell,i)=>{
            if(cell.tagName==='TD')cell.setAttribute('data-ww-label',head[i]||('Field '+(i+1)));
          });
        });
      }else{
        const rows=[...table.querySelectorAll('tbody tr')];
        if(rows.length&&rows.every(r=>r.children.length===2&&r.children[0].tagName==='TH')) fig.classList.add('ww-mobile-table-pairs');
      }
    });
  }

  function tagMobileFamilies(){
    const p=location.pathname;
    const add=(...x)=>document.body.classList.add(...x);
    if(p.indexOf('/practice/foundations/')===0)add('ww-mobile-foundations','ww-mobile-learning');
    if(p.indexOf('/practice/quickstarts/')===0&&p!=='/practice/quickstarts/')add('ww-mobile-quickstart-detail','ww-mobile-learning');
    if(p.indexOf('/practice/workforce-in-practice/')===0)add('ww-mobile-wip','ww-mobile-learning');
    if(p.indexOf('/ai-readiness-lab')===0)add('ww-mobile-ai');
    if(p.indexOf('/california-workforce-intelligence-report/')===0&&p!=='/california-workforce-intelligence-report/')add('ww-mobile-intel-detail');
    if(p.indexOf('/data/occupation-explorer/')===0)add('ww-mobile-occ');
    if(p.indexOf('/labor-market-profiles/')===0)add('ww-mobile-lmp');
    if(p.indexOf('/workforce-board-examples/')===0)add('ww-mobile-board-examples');
    if(p.indexOf('/national-practice-ideas/')===0)add('ww-mobile-national-practice');
    if(p.indexOf('/data/workforce-access-equity/')===0)add('ww-mobile-wae');
  }
  function optimizeLearningTables(){
    if(!document.body.classList.contains('ww-mobile-learning'))return;
    const figures=[...document.querySelectorAll('.wp-block-post-content figure.wp-block-table')];
    figures.forEach(fig=>{
      const table=fig.querySelector('table');if(!table)return;
      const head=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
      const rows=[...table.querySelectorAll('tbody tr')];
      if(!rows.length)return;
      const maxCols=Math.max(...rows.map(r=>r.children.length));
      if(maxCols<2)return;
      fig.classList.add('ww-mobile-learning-table');
      if(maxCols>2)fig.classList.add('ww-mobile-learning-multi');
      rows.forEach(tr=>{
        [...tr.children].forEach((cell,i)=>{
          if(cell.tagName==='TD'&&head.length)cell.setAttribute('data-ww-label',head[i]||('Field '+(i+1)));
        });
      });
    });
  }
  function addFoundationsMenu(){
    if(!document.body.classList.contains('ww-mobile-foundations')||document.querySelector('.ww-mobile-course-compact'))return;
    const root=document.querySelector('.wp-block-post-content');if(!root)return;
    const candidates=[...root.querySelectorAll('div')].filter(d=>{
      const links=[...d.querySelectorAll(':scope > a[href*="/practice/foundations/"]')];
      return links.length>=4;
    });
    const source=candidates[0];if(!source)return;
    const links=[...source.querySelectorAll(':scope > a[href*="/practice/foundations/"]')];
    const normalize=u=>{try{return new URL(u,location.origin).pathname.replace(/\/$/,'')||'/'}catch(_){return u}};
    const current=normalize(location.pathname);
    let idx=links.findIndex(a=>normalize(a.getAttribute('href'))===current);
    if(idx<0)idx=links.findIndex(a=>a.getAttribute('aria-current')==='page');
    const prev=idx>0?links[idx-1]:null,next=idx>=0&&idx<links.length-1?links[idx+1]:null;
    const wrap=document.createElement('div');wrap.className='ww-mobile-course-compact';
    const item=(a,label,disabled)=>disabled?'<span class="is-disabled">'+label+'</span>':'<a href="'+a.href+'">'+label+'</a>';
    wrap.innerHTML='<nav class="ww-mobile-course-primary" aria-label="Lesson navigation">'+item(prev,'‹ Previous',!prev)+'<a href="/practice/foundations/">Course</a>'+item(next,'Next ›',!next)+'</nav><details><summary>Course contents</summary><div class="ww-mobile-course-links">'+links.map(a=>'<a href="'+a.href+'"'+(normalize(a.href)===current?' aria-current="page"':'')+'>'+a.textContent.trim()+'</a>').join('')+'</div></details>';
    source.classList.add('ww-mobile-course-source');source.insertAdjacentElement('beforebegin',wrap);
  }
  function addAIMenu(){
    if(!document.body.classList.contains('ww-mobile-ai')||document.querySelector('.ww-mobile-ai-menu'))return;
    const nav=document.querySelector('.ww-ai-nav');if(!nav)return;
    const links=[...nav.querySelectorAll('a')];if(!links.length)return;
    const menu=document.createElement('details');menu.className='ww-mobile-ai-menu';
    menu.innerHTML='<summary>AI Readiness menu</summary><div class="ww-mobile-ai-links">'+links.map(a=>'<a href="'+a.href+'"'+(a.matches('.is-active,[aria-current="page"]')?' aria-current="page"':'')+'>'+a.textContent.trim()+'</a>').join('')+'</div>';
    const source=nav.closest('.ww-ai-nav-wrap')||nav;source.classList.add('ww-mobile-ai-nav-source');source.insertAdjacentElement('beforebegin',menu);
  }

  function run(){if(innerWidth>760)return;tagMobileFamilies();optimizeLearningTables();addFoundationsMenu();addAIMenu();optimizeGuidanceGrids();optimizePolicyTables();addDataJump();addTocAndActions();addNext()}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script>

<script id="ww-intelligence-context-runtime">
(function(){
  'use strict';
  const INDEX_PAGE=7501;
  const REST='/wp-json/wp/v2/pages/';
  const SCRIPT_INDEX='ww-intelligence-context-index';
  const SCRIPT_SHARD='ww-intelligence-reader-shard';

  function currentEntityId(){
    const classes=(document.body&&document.body.className)||'';
    let m=classes.match(/\bpostid-(\d+)\b/);
    if(m)return 'policy:'+m[1];
    m=classes.match(/\bpage-id-(\d+)\b/);
    if(m)return 'content:WP-PAGE-'+m[1];
    return '';
  }
  function parsePayload(html,id){
    const box=document.createElement('div');
    box.innerHTML=html||'';
    const node=box.querySelector('#'+id);
    if(!node)throw new Error('Intelligence runtime payload missing: '+id);
    const raw=(node.textContent||'').trim();
    return {raw:raw,data:JSON.parse(raw)};
  }
  async function pagePayload(pageId,scriptId){
    const res=await fetch(REST+pageId+'?_fields=id,modified,content',{credentials:'same-origin'});
    if(!res.ok)throw new Error('Intelligence runtime HTTP '+res.status);
    const page=await res.json();
    return parsePayload(page.content&&page.content.rendered,scriptId);
  }
  async function hashHex(algorithm,text,appendNewline){
    if(!window.crypto||!crypto.subtle)return '';
    const input=new TextEncoder().encode(String(text)+(appendNewline?'\n':''));
    const digest=new Uint8Array(await crypto.subtle.digest(algorithm,input));
    return Array.from(digest,b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function shardFor(entityId){
    if(!window.crypto||!crypto.subtle)return '';
    const digest=new Uint8Array(await crypto.subtle.digest('SHA-1',new TextEncoder().encode(entityId)));
    const n=((digest[0]*0x1000000)+(digest[1]<<16)+(digest[2]<<8)+digest[3])>>>0;
    return (n%16).toString(16);
  }
  function escapeHtml(value){
    return String(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  }
  function render(row){
    if(!row||!Array.isArray(row.recommendations)||row.recommendations.length<2||document.getElementById('ww-contextual-navigation'))return;
    const host=document.querySelector('.wp-block-post-content')||document.querySelector('main');
    if(!host)return;
    const section=document.createElement('section');
    section.id='ww-contextual-navigation';
    section.className='ww-contextual-nav';
    section.setAttribute('aria-labelledby','ww-contextual-navigation-title');
    const facets=(row.facets||[]).slice(0,3).map(f=>'<span class="ww-contextual-nav__facet"><b>'+escapeHtml(f.label||'Topic')+'</b>'+escapeHtml(f.title)+'</span>').join('');
    const cards=row.recommendations.slice(0,4).map(rec=>'<a class="ww-contextual-nav__card" data-kind="'+escapeHtml(rec.kind)+'" href="'+escapeHtml(rec.url)+'"><span class="ww-contextual-nav__label">'+escapeHtml(rec.label)+'</span><strong class="ww-contextual-nav__title">'+escapeHtml(rec.title)+'</strong><span class="ww-contextual-nav__open">Continue exploring →</span></a>').join('');
    section.innerHTML='<div class="ww-contextual-nav__shell"><p class="ww-contextual-nav__eyebrow">Connected intelligence</p><h2 id="ww-contextual-navigation-title">What this connects to</h2><p class="ww-contextual-nav__intro">Continue exploring related policy, data, and practice from across Workforce Wonkery.</p>'+(facets?'<div class="ww-contextual-nav__facets" aria-label="Connected topics">'+facets+'</div>':'')+'<div class="ww-contextual-nav__grid">'+cards+'</div></div>';
    const subscribe=host.querySelector('.wwo-subscribe-shell');
    if(subscribe)subscribe.insertAdjacentElement('beforebegin',section);else host.appendChild(section);
  }
  async function run(){
    const entityId=currentEntityId();
    if(!entityId)return;
    try{
      const indexPayload=await pagePayload(INDEX_PAGE,SCRIPT_INDEX);
      const index=indexPayload.data;
      const shard=await shardFor(entityId);
      const meta=index&&index.shards&&index.shards[shard];
      if(!meta||!meta.page_id)return;
      const payload=await pagePayload(meta.page_id,SCRIPT_SHARD);
      if(meta.sha256&&window.crypto&&crypto.subtle){
        const actual=await hashHex('SHA-256',payload.raw,true);
        if(actual&&actual!==meta.sha256)throw new Error('Intelligence runtime shard fingerprint mismatch');
      }
      const row=(payload.data.records||[]).find(x=>x.entity_id===entityId);
      if(row)render(row);
    }catch(err){
      console.warn('Workforce Wonkery contextual navigation unavailable',err);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script>
