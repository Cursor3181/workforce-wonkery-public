<style id="ww-sector-editorial-v2">
.spb{max-width:1440px;background:#fff}

.spb-quick-item+.spb-quick-item{padding-left:18px;border-left:1px solid var(--line)}
.spb-quick-item b{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#a84700}
.spb-quick-item p{margin:7px 0 0;font-size:13px;line-height:1.58;color:#425f72}

.spb-editorial-chapter.alt{background:#fbfdfe}

.spb-chapter-no{font-family:Georgia,'Times New Roman',serif;font-size:68px;line-height:.9;color:#d49b25}
.spb-chapter-head .spb-kicker{margin-top:4px}
.spb-chapter-head p{max-width:820px;margin:12px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}
.spb-editorial-chapter .spb-grid{margin:0;gap:46px}
.spb-copy h2{font-size:32px}
.spb-copy h3{font-size:23px}
.spb-copy p{font-size:15px;line-height:1.72}
.spb-metrics{margin-top:26px}
.spb-metric{padding-top:18px;padding-bottom:18px}
.spb-metric strong{font-size:29px}
.spb-metric span{font-size:11.5px}
.spb-story,.spb-model{margin-top:32px;padding:24px 25px}
.spb-story h3,.spb-model h3{font-size:25px}
.spb-story p,.spb-model p{font-size:14.5px;line-height:1.68}
.spb-side{position:sticky;top:24px;padding:24px 24px 26px;background:#f7fafb;border-top:5px solid var(--green)}
.spb-side h3{font-size:27px}
.spb-first{padding:16px 17px}
.spb-first p{font-size:14px;line-height:1.55}
.spb-side-list div{font-size:12.5px;line-height:1.58}
.spb-path,.spb-evidence{margin:0;padding:72px clamp(22px,5vw,72px);border-top:0;border-bottom:1px solid var(--line)}
.spb-path{background:#fbfdfe}
.spb-path>.spb-chapter-head,.spb-evidence>.spb-chapter-head{margin-bottom:28px}
.spb-path>p{max-width:900px;font-size:15px;line-height:1.65}
.spb-steps{margin-top:26px}
.spb-step{padding-top:20px;padding-bottom:21px}
.spb-step strong{font-size:19px}
.spb-step span{font-size:11.5px;line-height:1.55}
.spb-gate{margin-top:24px;padding:16px 18px;font-size:13px;line-height:1.6}
.spb-evidence{background:#fff}
.spb-evidence details{margin-top:0;border-top:1px solid var(--line)}
.spb-evidence details:last-of-type{border-bottom:1px solid var(--line)}
.spb-evidence summary{padding:15px 0;font-size:13px}
.spb-evidence details>div{padding:0 0 16px;font-size:13px;line-height:1.65}
.spb-evidence .spb-score-guide{display:block;margin:22px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.spb-evidence .spb-score-guide>summary{padding:15px 0}
.spb-evidence .spb-score-guide-copy p{font-size:12px;line-height:1.6}
.spb-sources{gap:8px 18px}
.spb-sources a{font-size:11.5px}
.spb-foot{margin:0;padding:24px clamp(22px,5vw,72px) 34px;background:#fcfaf6;border-top:1px solid var(--line);font-size:10.5px;line-height:1.6}
.spb a:focus-visible,.spb summary:focus-visible{outline:3px solid #185cac;outline-offset:4px}
@media(max-width:980px){.spb-editorial-layout{grid-template-columns:1fr}.spb-editorial-rail{display:none}.spb-editorial-chapter .spb-grid{grid-template-columns:1fr}.spb-side{position:static}.spb-quick-grid{grid-template-columns:1fr}.spb-quick-item+.spb-quick-item{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:680px){.spb-hero{padding-top:44px}.spb-chapter-head{grid-template-columns:54px minmax(0,1fr);gap:14px}.spb-chapter-no{font-size:48px}.spb-quick,.spb-editorial-chapter,.spb-path,.spb-evidence{padding-top:44px;padding-bottom:44px}.spb-evidence-profile{grid-template-columns:1fr}.spb-evidence-profile>div,.spb-evidence-profile>div+div,.spb-evidence-profile>div:last-child{grid-column:auto;padding-left:0;border-left:0}.spb-evidence-profile>div+div{border-top:1px solid var(--line)}.spb-steps{grid-template-columns:1fr}.spb-step+.spb-step{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
</style>
<script id="ww-sector-editorial-v2-script">
(function(){
 const root=document.querySelector('.spb'); if(!root||root.dataset.editorialV2)return;
 const main=root.querySelector('.spb-main'), hero=root.querySelector('.spb-hero'); if(!main||!hero)return;
 root.dataset.editorialV2='2.0';
 const text=n=>n?(n.textContent||'').replace(/\s+/g,' ').trim():'';
 const valueWithoutLabel=n=>{if(!n)return'';const c=n.cloneNode(true);c.querySelector('b')?.remove();return text(c);};
 const back=main.querySelector('.spb-back'), cue=main.querySelector('.spb-cue');
 if(cue)hero.append(cue);
 if(back){back.classList.add('spb-hero-back');hero.append(back);}
 const note=document.createElement('p');note.className='spb-reader-note';note.textContent='Use this brief to decide whether a sector partnership is the right tool, what to strengthen or validate next, and what evidence should change the decision.';hero.append(note);
 const profile=main.querySelector('.spb-evidence-profile');
 const guide=main.querySelector('.spb-score-guide');
 const decision=main.querySelector('.spb-decision');
 const grid=main.querySelector('.spb-grid');
 const copy=main.querySelector('.spb-copy');
 const side=main.querySelector('.spb-side');
 const path=main.querySelector('.spb-path');
 const evidence=main.querySelector('.spb-evidence');
 if(!grid||!copy||!side||!path||!evidence)return;
 const why=text(copy.querySelector(':scope > p'));
 const first=text(side.querySelector('.spb-first p'));
 const year=[...side.querySelectorAll('.spb-side-list>div')].find(n=>/^Year-one outcome/i.test(text(n)));
 const quick=document.createElement('section');quick.className='spb-quick';quick.id='spb-quick';
 quick.innerHTML='<div class="spb-kicker">The 3-minute brief</div><h2>What this partnership decision is really about</h2><p class="spb-section-intro">Start with the decision, then check the local evidence, the partnership design, and the conditions that would justify moving forward.</p><div class="spb-quick-grid"><div class="spb-quick-item"><b>Why it matters</b><p></p></div><div class="spb-quick-item"><b>First move</b><p></p></div><div class="spb-quick-item"><b>What success starts to look like</b><p></p></div></div>';
 const qp=quick.querySelectorAll('.spb-quick-item p'); if(qp[0])qp[0].textContent=why;if(qp[1])qp[1].textContent=first;if(qp[2])qp[2].textContent=valueWithoutLabel(year);
 if(decision)quick.insertBefore(decision,quick.querySelector('.spb-quick-grid'));
 if(profile)quick.append(profile);
 main.insertBefore(quick,grid);
 const chapter=document.createElement('section');chapter.className='spb-editorial-chapter';chapter.id='spb-case';
 chapter.innerHTML='<div class="spb-chapter-head"><div class="spb-chapter-no">01</div><div><div class="spb-kicker">The case for action</div><h2>Why this case deserves attention</h2><p>Read the local evidence, worker-value test, operating story, comparable model, and the proposed partnership design together.</p></div></div>';
 main.insertBefore(chapter,grid);chapter.append(grid);
 path.id='spb-path';path.insertAdjacentHTML('afterbegin','<div class="spb-chapter-head"><div class="spb-chapter-no">02</div><div><div class="spb-kicker">Action sequence</div><h2>Turn the idea into a testable partnership</h2><p>Move from problem definition to employer ownership, action, measurement, and sustainability without building more structure than the evidence supports.</p></div></div>');
 const oldPathHead=[...path.children].find(n=>n.classList?.contains('spb-kicker')||n.tagName==='H2');if(oldPathHead&&oldPathHead.classList?.contains('spb-kicker'))oldPathHead.style.display='none';
 const oldPathH2=[...path.children].find(n=>n.tagName==='H2');if(oldPathH2)oldPathH2.style.display='none';
 evidence.id='spb-evidence';evidence.insertAdjacentHTML('afterbegin','<div class="spb-chapter-head"><div class="spb-chapter-no">03</div><div><div class="spb-kicker">Evidence & sources</div><h2>Audit the conclusion</h2><p>Use the unresolved questions, redesign triggers, source links, and technical scoring to test whether the recommended posture still holds.</p></div></div>');
 const oldEvKick=[...evidence.children].find(n=>n.classList?.contains('spb-kicker')&&n.closest('.spb-chapter-head')===null);if(oldEvKick)oldEvKick.style.display='none';
 const oldEvH2=[...evidence.children].find(n=>n.tagName==='H2');if(oldEvH2)oldEvH2.style.display='none';
 if(guide)evidence.append(guide);
 const layout=document.createElement('div');layout.className='spb-editorial-layout';
 main.parentNode.insertBefore(layout,main);
 const rail=document.createElement('nav');rail.className='spb-editorial-rail';rail.setAttribute('aria-label','Sector partnership brief sections');
 rail.innerHTML='<b>In this brief</b><a href="#spb-quick"><strong>Quick read</strong>The decision</a><a href="#spb-case"><strong>01</strong>The case for action</a><a href="#spb-path"><strong>02</strong>Action sequence</a><a href="#spb-evidence"><strong>03</strong>Evidence & sources</a>';
 layout.append(rail,main);
})();
</script>
